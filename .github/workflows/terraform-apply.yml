name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.TF_VAR_AWS_REGION }}" \
            -var="alert_email=${{ secrets.TF_VAR_ALERT_EMAIL }}" \
            -var="s3_bucket_name=${{ vars.TF_VAR_S3_BUCKET_NAME }}" \
            -var="api_name=${{ vars.TF_VAR_API_NAME }}" \
            -var="budget_limit_usd=${{ vars.TF_VAR_BUDGET_LIMIT_USD }}" \
            -var="instance_type=${{ vars.TF_VAR_INSTANCE_TYPE }}" \
            -var="run_on_ecs=${{ vars.TF_VAR_RUN_ON_ECS }}"
