<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Student Community Day - Roulette</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 0 1rem 2rem; color: #1a1a1a; background: #131a2e; }
    .hero { text-align: center; padding: 2.5rem 1rem 2rem; margin: 0 -1rem 1.5rem; background: linear-gradient(180deg, #1a2744 0%, #131a2e 100%); position: relative; overflow: hidden; }
    .hero::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 100%), radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.2) 0%, transparent 100%), radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.15) 0%, transparent 100%), radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.2) 0%, transparent 100%), radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.1) 0%, transparent 100%); }
    .hero h1 { font-size: 2.8rem; font-weight: 800; line-height: 1.1; position: relative; }
    .hero h1 .white { color: #fff; }
    .hero h1 .orange { background: linear-gradient(135deg, #f59e0b, #f97316, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero h2 { font-size: 1.8rem; color: #fff; margin-top: 0.75rem; position: relative; }
    .hero .subtitle { color: #94a3b8; font-size: 0.95rem; margin-top: 0.5rem; position: relative; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
    .form-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type="text"] { flex: 1; padding: 0.5rem; border: 1px solid #475569; border-radius: 4px; font-size: 1rem; background: #0f172a; color: #fff; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; color: #fff; }
    .btn-add { background: #f97316; }
    .btn-pick { background: #16a34a; width: 100%; padding: 0.75rem; font-size: 1.1rem; display: none; }
    .btn-pick.visible { display: block; }
    .btn-remove { background: #dc2626; font-size: 0.85rem; padding: 0.25rem 0.5rem; }
    button:hover { opacity: 0.9; }
    ul { list-style: none; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #334155; color: #e2e8f0; }
    li:last-child { border-bottom: none; }
    .empty { color: #64748b; text-align: center; padding: 1rem; }
    .error { color: #dc2626; text-align: center; padding: 0.5rem; animation: fadeIn 0.3s ease; }

    /* Winner */
    .winner-box { background: linear-gradient(135deg, #f97316, #facc15); border: none; border-radius: 8px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .winner-box h2 { color: #0f172a; }

    /* Tabs */
    .tabs { display: flex; gap: 0; margin-bottom: 1rem; }
    .tab { flex: 1; padding: 0.6rem; text-align: center; cursor: pointer; background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-weight: 500; transition: background 0.2s, color 0.2s; }
    .tab:first-child { border-radius: 8px 0 0 8px; }
    .tab:last-child { border-radius: 0 8px 8px 0; }
    .tab.active { background: #f97316; color: #fff; border-color: #f97316; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Admin table */
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .admin-table th { text-align: left; padding: 0.5rem; border-bottom: 2px solid #475569; color: #94a3b8; font-weight: 600; }
    .admin-table td { padding: 0.5rem; border-bottom: 1px solid #334155; color: #e2e8f0; }
    .admin-table td.id-col { font-family: monospace; font-size: 0.8rem; color: #64748b; }
    .refresh-info { text-align: right; font-size: 0.75rem; color: #475569; margin-top: 0.5rem; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(720deg); }
    }
    li { animation: slideIn 0.3s ease; }
    .picking .btn-pick { animation: spin 1s ease-in-out; pointer-events: none; }

    /* Confetti */
    .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; overflow: hidden; }
    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 10px;
      height: 10px;
      animation: confettiFall 3s ease-in forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1><span class="white">AWS Student</span><br><span class="orange">Community Day</span></h1>
    <h2>Roulette</h2>
    <p class="subtitle">Register your name for a chance to win!</p>
  </div>

  <div id="winner-container"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('roulette')">Roulette</div>
    <div class="tab admin-only" onclick="switchTab('admin')" style="display:none">Admin</div>
  </div>

  <div id="tab-roulette" class="tab-content active">
    <div class="card">
      <div class="form-row">
        <input type="text" id="name-input" placeholder="Enter a name..." />
        <button class="btn-add" onclick="addUser()">Register</button>
      </div>
      <button class="btn-pick" id="pick-btn" onclick="pickWinner()">Pick a Winner</button>
    </div>

    <div class="card">
      <ul id="user-list"><li class="empty">No participants yet</li></ul>
    </div>
  </div>

  <div id="tab-admin" class="tab-content">
    <div class="card">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>ID</th><th></th></tr></thead>
        <tbody id="admin-list"><tr><td colspan="3" class="empty">No participants yet</td></tr></tbody>
      </table>
      <div class="refresh-info">Auto-refreshes every 60s &mdash; Last: <span id="last-refresh">--</span></div>
    </div>
  </div>

  <script>
    const API = "${api_url}";
    let adminInterval = null;
    let adminMode = false;

    function showError(msg) {
      document.getElementById("winner-container").innerHTML = '<div class="error">' + esc(msg) + '</div>';
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach((t, i) => {
        t.classList.toggle("active", (tab === "roulette" ? i === 0 : i === 1));
      });
      document.getElementById("tab-roulette").classList.toggle("active", tab === "roulette");
      document.getElementById("tab-admin").classList.toggle("active", tab === "admin");

      if (tab === "admin") {
        fetchAdmin();
        adminInterval = setInterval(fetchAdmin, 60000);
      } else {
        clearInterval(adminInterval);
        adminInterval = null;
      }
    }

    async function fetchUsers() {
      try {
        const res = await fetch(API + "/users");
        const users = await res.json();
        const list = document.getElementById("user-list");
        if (users.length === 0) {
          list.innerHTML = '<li class="empty">No participants yet</li>';
          return;
        }
        list.innerHTML = users.map(u =>
          '<li><span>' + esc(u.name) + '</span></li>'
        ).join("");
      } catch {
        showError("Could not connect to the API");
      }
    }

    async function fetchAdmin() {
      try {
        const res = await fetch(API + "/users");
        const users = await res.json();
        const tbody = document.getElementById("admin-list");
        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="empty">No participants yet</td></tr>';
        } else {
          tbody.innerHTML = users.map(u =>
            '<tr style="animation: slideIn 0.3s ease"><td>' + esc(u.name) + '</td><td class="id-col">' + esc(u.id) + '</td><td><button class="btn-remove" onclick="removeUser(\'' + u.id + '\')">Remove</button></td></tr>'
          ).join("");
        }
        document.getElementById("last-refresh").textContent = new Date().toLocaleTimeString();
      } catch {
        showError("Could not connect to the API");
      }
    }

    async function addUser() {
      const input = document.getElementById("name-input");
      const name = input.value.trim();
      if (!name) return;
      try {
        const res = await fetch(API + "/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.error) {
          showError(data.error);
          return;
        }
        document.getElementById("winner-container").innerHTML = "";
        input.value = "";
        if (!adminMode) {
          localStorage.setItem("registered", "1");
          disableRegistration();
        }
        fetchUsers();
      } catch {
        showError("Could not connect to the API");
      }
    }

    async function removeUser(id) {
      try {
        await fetch(API + "/users/" + id, { method: "DELETE" });
        fetchUsers();
        fetchAdmin();
      } catch {
        showError("Could not connect to the API");
      }
    }

    async function pickWinner() {
      const btn = document.getElementById("pick-btn");
      btn.parentElement.classList.add("picking");

      try {
        const res = await fetch(API + "/pick", { method: "POST" });
        const data = await res.json();

        setTimeout(() => {
          btn.parentElement.classList.remove("picking");
          const container = document.getElementById("winner-container");
          if (data.error) {
            showError(data.error);
          } else {
            container.innerHTML = '<div class="winner-box"><h2>Winner: ' + esc(data.winner.name) + '</h2></div>';
            announceWinner(data.winner.name);
            launchConfetti();
          }
          fetchUsers();
        }, 1000);
      } catch {
        btn.parentElement.classList.remove("picking");
        showError("Could not connect to the API");
      }
    }

    function announceWinner(name) {
      var utterance = new SpeechSynthesisUtterance("And the winner is... " + name + "!");
      utterance.rate = 0.9;
      utterance.pitch = 1.1;
      utterance.volume = 1;
      speechSynthesis.speak(utterance);
    }

    function launchConfetti() {
      const container = document.createElement("div");
      container.className = "confetti-container";
      document.body.appendChild(container);
      const colors = ["#facc15", "#2563eb", "#dc2626", "#16a34a", "#f97316", "#a855f7", "#ec4899"];
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 0.3 + "s";
        piece.style.animationDuration = (0.8 + Math.random() * 1) + "s";
        piece.style.width = (6 + Math.random() * 8) + "px";
        piece.style.height = (6 + Math.random() * 8) + "px";
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
        container.appendChild(piece);
      }
      setTimeout(() => container.remove(), 2000);
    }

    function disableRegistration() {
      var input = document.getElementById("name-input");
      var btn = document.querySelector(".btn-add");
      input.disabled = true;
      input.placeholder = "You are already registered!";
      btn.disabled = true;
      btn.style.opacity = "0.5";
      btn.style.cursor = "not-allowed";
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function toggleAdminMode() {
      adminMode = !adminMode;
      document.getElementById("pick-btn").classList.toggle("visible", adminMode);
      document.querySelector(".admin-only").style.display = adminMode ? "" : "none";
      if (adminMode) {
        enableRegistration();
      } else {
        if (localStorage.getItem("registered")) disableRegistration();
        if (document.getElementById("tab-admin").classList.contains("active")) {
          switchTab("roulette");
        }
      }
    }

    function enableRegistration() {
      var input = document.getElementById("name-input");
      var btn = document.querySelector(".btn-add");
      input.disabled = false;
      input.placeholder = "Enter a name...";
      btn.disabled = false;
      btn.style.opacity = "";
      btn.style.cursor = "";
    }

    document.addEventListener("keydown", e => {
      if (e.ctrlKey && e.shiftKey && e.key === "K") {
        e.preventDefault();
        toggleAdminMode();
      }
    });

    document.getElementById("name-input").addEventListener("keydown", e => {
      if (e.key === "Enter") addUser();
    });

    if (localStorage.getItem("registered")) disableRegistration();
    fetchUsers();
  </script>
</body>
</html>
